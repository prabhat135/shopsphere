<app-navbar></app-navbar>

<!-- Hero Section -->
<section class="hero">
  <h1>WEAR YOUR WORLD</h1>

  <!-- In your home.component.html -->
<div class="hero-cards">
  <a [routerLink]="['/products']" [queryParams]="{category: 'WINTER'}" class="hero-card">
    <img src="homePage_img/winter.jpg" />
    <span>Winter Wear</span>
  </a>

  <a [routerLink]="['/products']" [queryParams]="{category: 'SUMMER'}" class="hero-card">
    <img src="homePage_img/summer.jpg" />
    <span>Summer Wear</span>
  </a>

  <a [routerLink]="['/products']" [queryParams]="{category: 'FORMAL'}" class="hero-card">
    <img src="homePage_img/formal.jpg" />
    <span>Formal Wear</span>
  </a>
  
  <a [routerLink]="['/products']" [queryParams]="{category: 'CASUAL'}" class="hero-card">
    <img src="homePage_img/casual.jpg" />
    <span>Casual Wear</span>
  </a>
  
  <a [routerLink]="['/products']" [queryParams]="{category: 'TRADITIONAL'}" class="hero-card">
    <img src="homePage_img/traditional.jpg" />
    <span>Traditional Wear</span>
  </a>
</div>
</section>

<!-- Trending Section -->
<section class="trending">
  <h2>TRENDING</h2>
  <div class="carousel-container">
    <button class="carousel-btn prev" (click)="prevSlide()">
      <i class="bi bi-chevron-left"></i>
    </button>
    <div class="carousel">
      <div class="carousel-track" [style.transform]="'translateX(' + (-100 * currentSlide) + '%)'">
        <div class="carousel-slide" *ngFor="let item of trendingProducts">
          <a [routerLink]="['/product', item.productId]">
            <img [src]="item.imageUrl" class="carousel-image" [alt]="'Trending product ' + item.productId">
          </a>
        </div>
      </div>
    </div>
    <button class="carousel-btn next" (click)="nextSlide()">
      <i class="bi bi-chevron-right"></i>
    </button>
    
    <!-- Carousel Indicators -->
    <div class="carousel-indicators">
      <div *ngFor="let item of trendingProducts; let i = index" 
           [class.active]="i === currentSlide"
           class="indicator"
           (click)="goToSlide(i)">
      </div>
    </div>
  </div>
</section>

<!-- Products -->
<section class="products">
  <div class="product-card" *ngFor="let p of products">
    <img [src]="p.image" />
    <h4>{{ p.name }}</h4>
    <p>₹{{ p.price }}</p>
    <button>❤️</button>
  </div>
</section>


<app-footer></app-footer>
